<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids Player Family Library</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #5A3E8C; --soft: #9A86BF; --pink: #FF6F9C; --line: #F3D3DE; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: Poppins, sans-serif; color: var(--ink); background: linear-gradient(#FFF4FA, #F1E8FF) fixed; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 14px 16px 104px; }
  .press { cursor: pointer; transition: transform .12s; user-select: none; } .press:active { transform: scale(.95); }
  h1, h2, h3 { margin: 0; } p { margin: 0; }
  .hello { display: flex; align-items: flex-end; gap: 10px; margin: 6px 0 14px; }
  .hello svg.bun { width: 76px; height: 87px; flex: none; animation: hop 2.6s ease-in-out infinite; }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .bubble { background: #fff; border-radius: 22px 22px 22px 6px; padding: 10px 16px; box-shadow: 0 4px 0 var(--line); }
  .bubble h1 { color: #E85BB4; font-size: 22px; line-height: 1.15; } .bubble p { margin-top: 2px; color: var(--soft); font-size: 13.5px; }
  .sect { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 20px 2px 10px; }
  .sect h2 { font-size: 18px; } .sect small { color: var(--soft); font-size: 12px; text-align: right; }
  .card { background: #fff; border-radius: 22px; box-shadow: 0 4px 0 var(--line); overflow: hidden; }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .row { display: flex; gap: 12px; padding: 10px; align-items: center; }
  .row img, .row .ph { width: 78px; height: 78px; border-radius: 16px; object-fit: cover; flex: none; background: #FFE8F0; display: flex; align-items: center; justify-content: center; font-size: 32px; }
  .row b { display: block; font-size: 15px; line-height: 1.2; } .row small { display: block; color: var(--soft); font-size: 11.5px; margin-top: 2px; }
  .row p { font-size: 12.5px; margin-top: 3px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .badge { display: inline-block; font-size: 10.5px; font-weight: 700; color: #fff; padding: 2px 9px; border-radius: 10px; margin-bottom: 3px; background: linear-gradient(135deg, #FF8FB1, #B48CFF); white-space: nowrap; }
  .badge.up { background: linear-gradient(135deg, #7ED6A8, #3DBE8B); } .badge.xmas { background: linear-gradient(135deg, #FF8FA3, #E8506E); } .badge.app { background: linear-gradient(135deg, #A9DCFF, #3E9BE0); }
  .xbanner { padding: 14px 16px; display: flex; gap: 12px; align-items: center; background: linear-gradient(135deg, #FFF0F3, #EFFBF4); border: 2px dashed #F7C3CF; margin-bottom: 12px; }
  .xbanner .ic { font-size: 40px; } .xbanner b { color: #E8506E; font-size: 16px; } .xbanner p { margin-top: 2px; font-size: 13px; }
  /* the three big buttons on Home */
  .big3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
  .bigb { border-radius: 26px; padding: 16px 6px 12px; text-align: center; font-weight: 700; font-size: 15px; }
  .bigb .ic { font-size: 42px; display: block; line-height: 1.2; } .bigb small { display: block; font-weight: 500; font-size: 11px; opacity: .85; }
  /* the doors */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 12px; }
  .tile { border-radius: 26px; aspect-ratio: 1 / 1.05; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 700; font-size: 15px; position: relative; }
  .tile svg { width: 58%; height: 58%; } .tile .badge { position: absolute; top: 6px; right: 6px; }
  .ctop { border-radius: 0 0 34px 34px; margin: -14px -16px 14px; padding: 14px 16px 18px; color: #fff; }
  .back { width: 42px; height: 42px; border-radius: 50%; background: #fff; color: var(--pink); display: inline-flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 3px 0 rgba(0,0,0,.08); }
  .ctop .hd { display: flex; align-items: center; gap: 12px; margin-top: 8px; } .ctop .hd svg { width: 56px; height: 56px; } .ctop h2 { font-size: 26px; } .ctop p { opacity: .95; font-size: 13px; }
  .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .gcard { position: relative; } .gcard .cv { aspect-ratio: 1; width: 100%; object-fit: cover; display: block; }
  .gcard .ph { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; } .gcard .ph svg { width: 55%; }
  .gcard .txt { padding: 8px 12px 11px; } .gcard b { font-size: 14.5px; line-height: 1.2; display: block; } .gcard small { color: var(--soft); font-size: 12px; }
  .gcard .badge { position: absolute; top: 8px; left: 8px; margin: 0; }
  /* sheets from the bottom: a group's topics, a topic */
  .shade { position: fixed; inset: 0; background: rgba(90, 62, 140, .35); z-index: 30; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
  @keyframes fade { from { opacity: 0; } }
  .sheet { background: #FFF9FB; width: 100%; max-width: 760px; max-height: 88vh; overflow-y: auto; border-radius: 28px 28px 0 0; padding: 16px 16px 30px; animation: up .25s ease-out; position: relative; }
  @keyframes up { from { transform: translateY(40px); } }
  .sheet .sh { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; } .sheet h3 { font-size: 20px; flex: 1; }
  .x { width: 38px; height: 38px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; color: #E85B9A; box-shadow: 0 2px 0 var(--line); font-size: 17px; flex: none; }
  .topic .pic { width: 100%; max-height: 240px; object-fit: cover; border-radius: 20px; display: block; background: #FFE8F0; }
  .topic .where { color: var(--soft); font-size: 12.5px; margin: 10px 0 2px; } .topic h3 { font-size: 22px; margin-bottom: 6px; }
  .kinds { display: inline-flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 10px; } .kinds span { background: #F3EDFF; color: #7E62D6; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 12px; }
  .topic .about { font-size: 14px; line-height: 1.5; margin-bottom: 14px; }
  .topic .btn { display: flex; width: 100%; padding: 13px; font-size: 16px; }
  .topic .note { font-size: 11.5px; color: var(--soft); text-align: center; margin-top: 8px; }
  .btns { display: flex; gap: 8px; margin-top: 8px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--pink); color: #fff; font-weight: 700; border-radius: 20px; padding: 10px 14px; font-size: 14.5px; box-shadow: 0 4px 0 #D9467A; text-decoration: none; flex: 1; font-family: inherit; border: 0; }
  .btn.alt { background: #fff; color: var(--ink); box-shadow: 0 4px 0 var(--line); } .btn.green { background: #3DBE8B; box-shadow: 0 4px 0 #2E9A6F; } .btn.off { background: #E8DDF7; color: var(--soft); box-shadow: none; }
  /* downloads: a cover with the explanation next to it */
  .dl { display: flex; gap: 14px; padding: 12px; align-items: stretch; }
  .dl img { align-self: flex-start; height: auto; width: 112px; aspect-ratio: 210 / 297; object-fit: cover; object-position: top; border-radius: 12px; border: 1px solid #F6E6EE; flex: none; background: #fff; }
  .dl .txt { display: flex; flex-direction: column; flex: 1; } .dl b { font-size: 16px; line-height: 1.2; } .dl p { font-size: 13px; line-height: 1.45; margin: 4px 0 6px; } .dl small { color: var(--soft); font-size: 11.5px; }
  .dl .btns { margin-top: auto; padding-top: 8px; }
  /* the shop */
  .shop2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .sitem { padding: 18px 14px; text-align: center; } .sitem .ic { font-size: 54px; display: block; } .sitem b { font-size: 17px; display: block; margin-top: 4px; } .sitem p { font-size: 12.5px; color: var(--soft); margin-top: 2px; }
  .who { display: flex; gap: 8px; flex-wrap: wrap; } .who span { background: #fff; border-radius: 18px; padding: 6px 14px 6px 8px; box-shadow: 0 3px 0 var(--line); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .who span svg { width: 28px; height: 32px; } .who span.on { box-shadow: 0 0 0 3px #3DBE8B, 0 3px 0 #2E9A6F; }
  .refills { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .ref { padding: 12px; text-align: center; position: relative; } .ref .ic { font-size: 38px; display: block; } .ref b { display: block; font-size: 14.5px; } .ref small { color: var(--soft); font-size: 11.5px; display: block; }
  .ref .n { display: inline-block; margin-top: 6px; background: #FFF0D6; color: #C98A00; font-weight: 700; font-size: 12px; padding: 2px 10px; border-radius: 10px; }
  .ref .tick { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%; border: 3px solid #E8DDF7; color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .ref.on { box-shadow: 0 0 0 3px #3DBE8B, 0 4px 0 #2E9A6F; } .ref.on .tick { background: #3DBE8B; border-color: #3DBE8B; }
  .total { text-align: center; margin: 14px 0 4px; font-size: 15px; } .total b { color: #E85B7A; font-size: 18px; }
  .books { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .bk img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; } .bk .txt { padding: 10px 12px 12px; } .bk b { font-size: 16px; display: block; } .bk p { font-size: 13px; line-height: 1.45; margin: 4px 0 4px; }
  textarea { width: 100%; min-height: 70px; border-radius: 18px; border: 2px solid var(--line); padding: 12px; font-family: inherit; font-size: 14px; color: var(--ink); resize: vertical; }
  .done { text-align: center; padding: 26px 16px; } .done .ic { font-size: 64px; animation: hop 1.6s ease-in-out infinite; display: inline-block; } .done h2 { color: #E85B7A; margin-top: 6px; }
  .mine { padding: 10px 14px; display: flex; gap: 10px; align-items: center; } .mine .ic { font-size: 26px; } .mine b { font-size: 14px; display: block; } .mine small { color: var(--soft); font-size: 11.5px; }

  .empty { text-align: center; color: var(--soft); padding: 20px; font-size: 14px; }
  .pretend { text-align: center; font-size: 12px; color: var(--soft); margin: -6px 0 12px; }
  /* the bar at the bottom */
  .nav { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; box-shadow: 0 -4px 18px rgba(232, 91, 180, .12); border-radius: 24px 24px 0 0; display: flex; justify-content: center; z-index: 20; padding: 6px 6px calc(8px + env(safe-area-inset-bottom)); }
  .nav .in { display: flex; width: 100%; max-width: 560px; }
  .nb { flex: 1; text-align: center; padding: 6px 2px; border-radius: 16px; color: var(--soft); font-size: 11.5px; font-weight: 600; }
  .nb .ic { font-size: 24px; display: block; line-height: 1.2; } .nb.on { color: var(--pink); background: #FFF0F6; }
  /* the family code */
  .gate { position: fixed; inset: 0; z-index: 50; background: linear-gradient(#FFF4FA, #F1E8FF); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
  .gate svg.bun { width: 110px; height: 126px; animation: hop 2.6s ease-in-out infinite; }
  .gate h1 { color: #E85BB4; font-size: 24px; margin-top: 6px; } .gate p { color: var(--soft); margin: 4px 0 14px; font-size: 14px; }
  .dots { display: flex; gap: 12px; margin-bottom: 16px; } .dots i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #CDBBFF; } .dots i.on { background: var(--pink); border-color: var(--pink); }
  .pad { display: grid; grid-template-columns: repeat(3, 70px); gap: 12px; } .key { height: 62px; border-radius: 22px; background: #fff; box-shadow: 0 4px 0 var(--line); font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; color: var(--ink); }
  .shake { animation: shake .4s; } @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .demo { position: fixed; top: 8px; right: 8px; z-index: 60; background: #fff; color: var(--soft); font-size: 11px; padding: 3px 9px; border-radius: 10px; box-shadow: 0 2px 0 var(--line); }
</style>

      if (!items.length) { $('total').classList.remove('shake'); void $('total').offsetWidth; $('total').classList.add('shake'); return; }
      var n = items.reduce(function (a, r) { return a + (+r.sheets || 0); }, 0); $('go').textContent = 'Sending…';
      API.send({ type: 'refill', who: who, item: items.map(function (r) { return r.name + ' (' + r.sheets + ')'; }).join(', '), sheets: n, note: $('note').value.trim() }, function (ok) {
        if (!ok) { $('go').textContent = 'Try again 📨'; return; }
        $('app').innerHTML = '<div class="card done"><span class="ic">📦</span><h2>Your refills are on their way!</h2><p>' + n + ' sheets for ' + esc(who) + ' ✨</p><div class="btns" style="max-width:220px;margin:14px auto 0"><span class="btn press" id="ok">Back to the shop</span></div></div>';
        $('ok').onclick = function () { go('shop'); };
      });
    };
  }
  function books() {
    var wl = store('wishlist') || {};
    var h = '<div class="ctop" style="background:#B48CFF"><span class="back press" id="back">◀</span><div class="hd"><span style="font-size:48px">📚</span><div><h2>New printable books</h2><p>Join the wishlist and we will make one for you</p></div></div></div>' + whoRow('who2') + '<div class="books" style="margin-top:14px">';
    S.books.forEach(function (b, i) {
      h += '<div class="card bk">' + (b.cover ? '<img src="' + b.cover + '" alt="">' : '') + '<div class="txt">' + (fresh(b.added) ? '<span class="badge">New</span>' : '') + '<b>' + esc(b.title) + '</b><p>' + esc(b.about) + '</p>' +
        '<div class="btns"><span class="btn press' + (wl[b.title] ? ' off' : '') + '" data-b="' + i + '">' + (wl[b.title] ? '✓ On the wishlist' : '💖 Join the wishlist') + '</span></div></div></div>';
    });
    if (!S.books.length) h += '<div class="empty">New books are coming soon!</div>';
    $('app').innerHTML = h + '</div>'; bindWho('who2');
    $('back').onclick = function () { go('shop'); };
    $('app').querySelectorAll('[data-b]').forEach(function (btn) {
      btn.onclick = function () {
        var b = S.books[+btn.getAttribute('data-b')]; if (wl[b.title]) return;
        askWho(function (who) {
          btn.textContent = 'Sending…';
          API.send({ type: 'book', who: who, item: b.title }, function (ok) {
            if (!ok) { btn.textContent = 'Try again 💖'; return; }
            wl[b.title] = true; store('wishlist', wl); btn.className = 'btn off'; btn.textContent = '✓ On the wishlist';
          });
        });
      };
    });
  }
  function mine() {
    API.list(function (l) {
      var el = $('mine'); if (!el) return;
      var IC = { refill: '📦', book: '📚', topic: '📨' }, NAME = { refill: 'Refills', book: 'Wishlist', topic: 'Topic' };
      el.innerHTML = (l || []).length ? '<div style="display:grid;gap:10px">' + l.slice(0, 12).map(function (r) {
        return '<div class="card mine"><span class="ic">' + (IC[r.type] || '💌') + '</span><div><b>' + NAME[r.type] + ': ' + esc(r.item) + '</b><small>' + esc(r.who) + ' · ' + day(r.at) + (r.sheets ? ' · ' + r.sheets + ' sheets' : '') + '</small></div>' +
          '<span class="st' + (r.status === 'done' ? ' ok' : '') + '">' + (r.status === 'done' ? 'Done ✓' : 'Sent') + '</span></div>';
      }).join('') + '</div>' : '<div class="empty">Nothing yet</div>';
    });
  }

  function start() {
    if (!ONLINE) { var d = document.createElement('div'); d.className = 'demo'; d.textContent = 'Preview'; document.body.appendChild(d); }
    $('app').innerHTML = hello('One moment… 💖', 'Opening our library');
    API.data(function (data) {
      if (data === undefined) { $('app').innerHTML = hello('Oh no!', 'I can’t reach our library. Check the internet, then open this page again.'); return; }
      if (!data) { store('in', false); gate(); return; }      // the family code was changed: type the new one
      useData(typeof data === 'string' ? JSON.parse(data) : data); go('home');
    });
  }
  gate();
})();
</script>
</body></html>
